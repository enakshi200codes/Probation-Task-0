<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .green-box {
            background-color: rgb(149, 199, 69);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 50px;
            border-bottom: 1px solid black;
        }
        .green-box a {
            color: black;
        }
        .down {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid black;
        }
        .skin-box {
            width: 50%;
            height: 300px;
            width: 300px;
            background-color: rgb(253, 209, 150);
            border-right: 1px solid black;
            padding: 60px 0;
        }
        .login-box {
            width: 50%;
            height: 300px;
            width: 1500px;
        }

        .skin-box ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .skin-box li {
            padding-bottom: 50px;
            padding-left: 20px;
            font-size: 20px;
        }

        .skin-box li a {
            color: black;
        }

        </style>
</head>
<body>
    <div class="green-box">
        <a href="#">HOME</a>
        <a href="#">LOGIN</a>
        <a href="#">REGISTER</a>
        <a href="#">CATALOGUE</a>
    </div>
    <div class="down">
        <div class="skin-box">
            <ul>
                <li><a href="#">CSE</a></li>
                <li><a href="#">ECE</a></li>
                <li><a href="#">EEE</a></li>
                <li><a href="#">MECH</a></li>
            </ul>
        </div>
        <div class="login-box">
            <img src="Images/login.png" alt="">
        </div>
    </div>
</body>
</html>
